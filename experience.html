<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ED07 — Built, Not Given</title>
<meta name="description" content="Enrique Dias. Built, not given.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--lime:#44d62d}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;color:#fff;font-family:'Archivo',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}

  .bar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:18px 26px}
  .bar .brand{display:flex;align-items:center;gap:12px}
  .bar .brand img{width:34px;height:34px;object-fit:contain}
  .bar .brand span{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.28em;text-transform:uppercase}
  .bar .shop{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.45);padding:8px 14px}

  .scene{position:relative;height:100vh;width:100vw;overflow:hidden;
    background:radial-gradient(60% 55% at 50% 42%,rgba(30,90,20,.20),transparent 70%),
      radial-gradient(120% 90% at 50% 120%,rgba(68,214,45,.10),transparent 60%), #000;
    perspective:1200px}

  /* Enrique in the centre */
  .hero-fig{position:absolute;left:50%;bottom:-2vh;transform:translateX(-50%);height:100vh;z-index:5;
    filter:contrast(1.03) brightness(1.02)}
  .hero-fig img{height:100%;width:auto;object-fit:contain;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 16%,#000 84%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 13%,#000 74%,transparent 99%);
    -webkit-mask-composite:source-in;
    mask-image:linear-gradient(to right,transparent 0,#000 16%,#000 84%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 13%,#000 74%,transparent 99%);
    mask-composite:intersect}
  .vignette{position:absolute;inset:0;z-index:6;pointer-events:none;
    background:radial-gradient(70% 60% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}

  .floater{position:absolute;top:0;left:0;will-change:transform,opacity;pointer-events:none}
  .floater.img{mix-blend-mode:screen}
  .floater.img img{display:block;width:100%;height:auto;
    -webkit-mask-image:radial-gradient(closest-side,#000 52%,transparent 100%);
    mask-image:radial-gradient(closest-side,#000 52%,transparent 100%)}
  .floater.txt{font-weight:900;text-transform:uppercase;line-height:.9;letter-spacing:-.01em;white-space:nowrap;color:#fff;
    text-shadow:0 6px 30px rgba(0,0,0,.6)}
  .floater.txt.mono{font-family:'Space Mono',monospace;font-weight:700;letter-spacing:.14em}
  .floater .lime{color:var(--lime)}
  .floater.bolt{color:var(--lime)}
  .floater.bolt svg{width:100%;height:auto;filter:drop-shadow(0 0 12px rgba(68,214,45,.6))}

  .cap{position:absolute;left:0;right:0;bottom:5vh;z-index:20;text-align:center;pointer-events:none}
  .cap .eye{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--lime);margin-bottom:12px}
  .cap h1{font-size:clamp(30px,5.4vw,74px);font-weight:900;text-transform:uppercase;line-height:.9}
  .cap h1 .lime{color:var(--lime)}
  .drag-hint{position:absolute;right:26px;bottom:5vh;z-index:20;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#6a6a6a;pointer-events:none}
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><img src="assets/ed07-logo-green.png" alt="ED07"><span>Enrique Dias</span></div>
  <a class="shop" href="https://ed07builtnotgiven.etsy.com" target="_blank" rel="noopener">Shop</a>
</div>

<section class="scene" id="scene">
  <div class="floaters" id="back"></div>
  <div class="hero-fig"><img src="assets/card-enrique.jpg" alt="Enrique Dias"></div>
  <div class="floaters" id="front"></div>
  <div class="vignette"></div>
  <div class="cap">
    <div class="eye">Enrique Dias · 9 · Building his road to F1</div>
    <h1>Built, <span class="lime">Not</span> Given.</h1>
  </div>
  <div class="drag-hint">move your mouse ·</div>
</section>

<script>
(function(){
  var scene=document.getElementById('scene');
  var backEl=document.getElementById('back'), frontEl=document.getElementById('front');
  var BOLT='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M14.5 2 L5 13.4 h5.2 L9 22 L19 9.6 h-5.4 z"/></svg>';

  // config: what floats around Enrique. depth 0..1 (near=1). x is % across.
  var ITEMS=[
    {layer:'back',  kind:'img', src:'assets/card-collect.jpg',                        w:210, x:80, depth:.42},
    {layer:'back',  kind:'txt', html:'Go<br>Kart',                                    size:46, x:14, depth:.4},
    {layer:'back',  kind:'img', src:'assets/ed07-logo-green.png',                     w:120, x:24, depth:.34},
    {layer:'back',  kind:'txt', html:'07', mono:false,                                size:120,x:70, depth:.3, dim:.5},
    {layer:'back',  kind:'img', src:'assets/etsy-wear/ED07-camiseta-branca-3D-costas.jpg', w:180, x:60, depth:.5},
    {layer:'front', kind:'img', src:'assets/card-collect.jpg',                        w:360, x:12, depth:.95},
    {layer:'front', kind:'txt', html:'Built,<br><span class="lime">Not</span><br>Given', size:64, x:83, depth:.9},
    {layer:'front', kind:'img', src:'assets/etsy-wear/ED07-hoodie-branco-costas.jpg', w:250, x:90, depth:.72},
    {layer:'front', kind:'img', src:'assets/ed07-logo-green.png',                     w:150, x:8,  depth:.8},
    {layer:'front', kind:'txt', mono:true, html:'3D&nbsp;Printed',                    size:22, x:30, depth:.62},
    {layer:'front', kind:'bolt', w:60, x:92, depth:.7},
    {layer:'front', kind:'bolt', w:34, x:6,  depth:.55}
  ];

  var vw=function(){return window.innerWidth}, vh=function(){return window.innerHeight};
  var objs=[];
  ITEMS.forEach(function(cfg){
    var el=document.createElement('div');
    el.className='floater '+(cfg.kind==='img'?'img':cfg.kind==='bolt'?'bolt':'txt')+(cfg.mono?' mono':'');
    if(cfg.kind==='img'){ el.innerHTML='<img src="'+cfg.src+'" alt="">'; el.style.width=cfg.w+'px'; }
    else if(cfg.kind==='bolt'){ el.innerHTML=BOLT; el.style.width=cfg.w+'px'; }
    else { el.innerHTML=cfg.html; el.style.fontSize=cfg.size+'px'; if(cfg.dim) el.style.color='rgba(255,255,255,'+cfg.dim+')'; }
    (cfg.layer==='front'?frontEl:backEl).appendChild(el);
    var o={el:el, depth:cfg.depth, xPct:cfg.x,
      y: Math.random()*vh()*1.2 - vh()*0.1,
      phase: Math.random()*6.28,
      sway: 22+Math.random()*30,
      vy: 10 + cfg.depth*26,        // px/sec, nearer falls faster
      rot: (Math.random()-0.5)*10,
      vrot: (Math.random()-0.5)*4,
      spin: Math.random()*6.28};
    objs.push(o);
  });

  var mx=0,my=0,tmx=0,tmy=0;
  window.addEventListener('mousemove',function(e){ tmx=(e.clientX/vw()-0.5); tmy=(e.clientY/vh()-0.5); });

  var last=performance.now();
  function frame(now){
    var dt=Math.min((now-last)/1000,0.05); last=now;
    mx+=(tmx-mx)*0.06; my+=(tmy-my)*0.06;
    for(var i=0;i<objs.length;i++){
      var o=objs[i];
      o.y+=o.vy*dt; o.phase+=dt*0.5; o.spin+=dt;
      var H=vh();
      if(o.y> H+160){ o.y=-160; }
      var baseX=o.xPct/100*vw();
      var swayX=Math.sin(o.phase)*o.sway;
      var px= -mx*(60+o.depth*140);      // parallax by depth
      var py= -my*(20+o.depth*70);
      var scale=0.55+o.depth*0.75;
      var floatY=Math.sin(o.spin*0.8)*6;
      var x=baseX+swayX+px, y=o.y+floatY+py;
      var rot=o.rot+Math.sin(o.spin*0.5)*3;
      o.el.style.transform='translate3d('+x+'px,'+y+'px,0) scale('+scale+') rotate('+rot+'deg)';
      o.el.style.opacity=(0.35+o.depth*0.6).toFixed(2);
      o.el.style.filter='blur('+((1-o.depth)*2.4).toFixed(1)+'px)';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
